pluginManagement {
    plugins {
        id 'org.springframework.boot' version '3.2.4'
        id 'com.google.protobuf' version '0.8.15'
        id "org.flywaydb.flyway" version '11.8.1'
    }
}

rootProject.name = 'CheeseMilk'
