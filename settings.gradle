pluginManagement {
    plugins {
        id 'org.springframework.boot' version '3.5.3'
        id 'com.google.protobuf' version '0.8.15'
        id "org.flywaydb.flyway" version '11.8.1'
    }
    repositories {
        gradlePluginPortal()
        maven {
            url "https://maven.aliyun.com/repository/gradle-plugin"
        }
    }
}

rootProject.name = 'CheeseMilk'
include 'gateway'
include 'common'
include 'core'
include 'search'
include 'registry'
include 'community'
include 'resource-server'
include 'ws-server'
include 'message'

